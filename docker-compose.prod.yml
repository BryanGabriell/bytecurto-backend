services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: bytecurto:latest
    container_name: bytecurto-app
    restart: unless-stopped
    env_file:
      - .env.prod
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - ./certs:/app/certs:ro
    depends_on:
      meubanco:
        condition: service_healthy
    networks:
      - bytecurto-net

  meubanco:
    image: postgres:16
    container_name: bytecurto-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_bytecurto:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bytecurto-net

networks:
  bytecurto-net:
    driver: bridge

volumes:
  postgres_bytecurto: