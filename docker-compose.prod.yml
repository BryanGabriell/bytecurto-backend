services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: bytecurto:latest
    container_name: bytecurto-app
    restart: unless-stopped
    env_file:
      - .env.prod
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - ./certs:/app/certs:ro
    networks:
      - bytecurto-net

networks:
  bytecurto-net:
    driver: bridge